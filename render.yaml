# Render.com deployment configuration
# Docs: https://render.com/docs/render-yaml-reference

services:
  - type: web
    name: fitness-buddy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: IBM_API_KEY
        value: MSRATqEUgVVg4ZlXChwTnB6XXYSR4b1KmbKgguW-jVph
      - key: IBM_PROJECT_ID
        value: b764144e-ada9-4eda-ae4b-9be3543dd609
      - key: IBM_WML_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: IBM_IAM_URL
        value: https://iam.cloud.ibm.com/identity/token
      - key: IBM_GRANITE_MODEL
        value: ibm/granite-4-h-small
      - key: MAX_NEW_TOKENS
        value: 800
      - key: TEMPERATURE
        value: "0.7"
      - key: TOP_P
        value: "0.9"
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 200
